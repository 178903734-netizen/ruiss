# 本项目 cargo 配置（Windows / Mac 共用同一份，勿写平台专用路径！）：
# 1. crate 下载走 rsproxy 国内镜像（crates.io 直连慢，Mac 上也生效）
# 2. Windows 编译产物目录由环境变量 CARGO_TARGET_DIR 控制（=D:/ruiss-target，
#    见 scripts/set-ruiss-env.ps1；Mac 不设置，用默认 ~/src-tauri/target）
# 3. 注意：不要在这里写 target-dir（Windows 的 D:/ 路径在 Mac 上会导致
#    DYLD_FALLBACK_LIBRARY_PATH 报错）

[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[net]
git-fetch-with-cli = true

# Windows 编译产物目录由环境变量 CARGO_TARGET_DIR 控制（见 scripts/set-ruiss-env.ps1），
# 不要在配置文件里写 target-dir（Windows 专用路径在 Mac 上会导致解析错误）。
